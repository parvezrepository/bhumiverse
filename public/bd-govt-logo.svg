  <path d="M 50 25 C 45 22 42 19 43 16 C 46 19 48 22 50 25 Z" fill="#D4AF37" />
  <path d="M 50 25 C 55 22 58 19 57 16 C 54 19 52 22 50 25 Z" fill="#D4AF37" />

